# ---------------------------------------------------------------------------
# Engines and win patterns (SIM_PLAN.md section 5).
#
# PROVISIONAL. Effects are not authored until Phase 7, so the stub policy is
# not really piloting this deck and any number produced now is about the loop,
# not about the list. The structure is what is being exercised.
#
# Patterns name the STATE they detect, never an outcome. This deck contains no
# card that reads "you win the game" - Emrakul targets an opponent, Hullbreaker
# bounces permanents you do not control, Finale wants a combat step - so the
# quantity is TURNS TO ASSEMBLY (section 5.4). The loader rejects a pattern
# named like an outcome.
# ---------------------------------------------------------------------------

[[engine]]
name = "kinnan_basalt"
sets = ["INFINITE:C"]
# Basalt taps for {C}{C}{C}, Kinnan adds one {C}, {3} untaps it: net +1
# colourless per iteration. The mana is COLOURLESS, which is why the outlet
# below is Thrasios ({4} generic) and not Kinnan's own {5}{G}{U} (section 2.6).
[engine.requires]
in_play = ["Kinnan, Bonder Prodigy", "Basalt Monolith"]
# NOT `untapped = ["Basalt Monolith"]`, which was a proxy and the wrong one.
# The loop is unbounded if its ENTRY COST is payable now: {3} to untap Basalt.
# That one check covers both cases without a special case - an untapped Basalt
# is itself a 4-mana source and pays its own entry, while a tapped one requires
# the {3} from elsewhere. Presence alone would fire with two mana and a tapped
# Basalt, which is a loop you cannot enter.
loop_entry_cost = 3
# ONE activation is unbounded here, and that is the whole difference from the
# dig below: {3} untaps Basalt, which then taps for 4 again, so entering the
# loop once is entering it forever. Declared rather than defaulted so that the
# contrast with `activations = 2` is visible in the file.
activations     = 1

[[engine]]
name = "kinnan_enduring_vitality"
sets = ["WIDE_COLOUR"]
# Vitality grants every creature "{T}: add one mana of any color"; Kinnan makes
# each of them produce two. Wide coloured mana, NOT unbounded - which is why it
# sets a different flag.
[engine.requires]
in_play            = ["Kinnan, Bonder Prodigy", "Enduring Vitality"]
creature_count_gte = 2

[[win]]
name = "infinite_C_into_thrasios"
# Thrasios costs {4} to activate, all generic, so unbounded colourless converts
# straight into drawing the library. The deck's primary line.
[win.requires]
flag    = "INFINITE:C"
in_play = ["Thrasios, Triton Hero"]

[[win]]
name = "infinite_C_outlet_in_hand"
# Engine assembled with the outlet still in hand. A weaker state than the one
# above and deliberately a separate pattern rather than an OR, so the mix
# reports how often the deck arrives here instead.
#
# THE ENTRY COST HERE IS A COLOUR, NOT A QUANTITY, and that is the whole reason
# it took a four-pattern audit to find. Thrasios in HAND must first be CAST, and
# he costs {G}{U}. INFINITE:C is COLOURLESS. The engine that makes this pattern
# interesting cannot pay for the card the pattern is about.
#
# This is section 2.6's typed-flag argument applied one level further than 2.6
# applied it. 2.6 established that a boolean INFINITE_MANA would wrongly let the
# colourless engine pay Kinnan's {5}{G}{U}, and the typed flag prevents exactly
# that - for the ACTIVATION. Nobody then checked the CAST, which is where this
# pattern differs from infinite_C_into_thrasios: that one has Thrasios already
# on the battlefield and its {4} activation is generic, so unbounded {C} really
# does pay for it forever and it correctly needs no entry cost at all.
#
# entry_pips rather than a bigger loop_entry_cost, because no amount of generic
# mana expresses "and two of it must be green and blue". Section 16.7 called
# this R2 and rejected it for Kinnan's dig, where the constraint genuinely is a
# quantity; here it genuinely is not.
[win.requires]
flag        = "INFINITE:C"
in_hand     = ["Thrasios, Triton Hero"]
entry_pips  = ["G", "U"]
activations = 1

[[win]]
name = "wide_colour_into_kinnan_dig"
# "{5}{G}{U}: Look at the top five cards of your library. You may put a
# non-Human creature card from among them onto the battlefield."
#
# READ THE COST SYMBOL. There is NO TAP SYMBOL. Being tapped is irrelevant to
# this ability and it can be activated as often as the mana allows.
#
# This carried `untapped = ["Kinnan, Bonder Prodigy"]` for four phases, and the
# mistake has a name: Kinnan has TWO abilities with DIFFERENT requirements. The
# static multiplier - "whenever you tap a nonland permanent for mana" - is about
# tapping OTHER permanents and needs Kinnan only present. The activated dig is
# about paying mana. The tap-ness in the first got copied onto the second.
#
# It was not a small error. It was the only `untapped` term in the file, it sat
# on the deck's top-firing pattern, and it was silently doing a DIFFERENT job:
# limiting a pattern that had no cost check at all. Removing it alone took
# P(assembled by turn 3) from 9.47% to 20.17% - the wrong constraint had been
# acting as a brake on a missing one.
#
# So the entry cost, which is what the requirement should have been all along.
# {5}{G}{U} is seven mana. Same shape as kinnan_basalt's `loop_entry_cost = 3`
# above and the same lesson as section 5.3's 1095 -> 9 -> 1258 history: a proxy
# replaced by the actual condition, with the number moving in both directions
# before it was right.
#
# APPROXIMATION, stated with its direction: loop_entry_cost is generic-only, so
# this asks for seven mana and not for {G} and {U} specifically. That is looser
# than the real cost and therefore OVERSTATES slightly. It is close here because
# WIDE_COLOUR requires two creatures and Enduring Vitality makes every creature
# tap for any colour, so a board that can pay seven can essentially always
# produce a green and a blue among it.
#
# HOW MANY ACTIVATIONS COUNT AS ASSEMBLED - a judgement about Magic, declared
# here, printed in the honesty header, and worth ~3 points of P(assembled by
# turn 3) between 1 and 2 (section 16.7). More than every card in this deck
# except three.
#
# Two, on the reading that ONE dig looks at five cards and puts one non-Human
# creature onto the battlefield - a good turn, not an assembled combo (section
# 5.4) - and the second is what converts it into Thrasios plus a board.
#
# UNLIKE kinnan_basalt, this does not self-sustain, and that was measured rather
# than assumed before the number was fixed. At the moment this pattern fires the
# undrawn library averages 84.6 cards holding 19.4 non-Human creatures, so the
# dig hits in 73.6% of activations. Every hit is worth exactly 2 mana - Enduring
# Vitality grants "{T}: add one mana of any colour" uniformly and Kinnan doubles
# it - so the expected return is 1.47 mana against a 7-mana cost. **A hit funds
# 21% of the next activation**, and 0% within the same turn in real Magic, since
# a creature that just entered has summoning sickness. The engine does not pay
# for itself, so a constant N is the right parameterisation.
[win.requires]
flag            = "WIDE_COLOUR"
in_play         = ["Kinnan, Bonder Prodigy"]
loop_entry_cost = 7
activations     = 2

[[win]]
name = "wide_colour_into_thrasios"
# "{4}: Scry 1, then reveal the top card of your library. If it's a land card,
# put it onto the battlefield tapped. Otherwise, draw a card."
#
# WIDE_COLOUR is FINITE coloured mana, so N activations cost 4N - unlike
# infinite_C_into_thrasios, where unbounded {C} pays {4} forever and no count is
# needed. This pattern had no cost model at all until the four-pattern audit,
# and it was firing on a board averaging 3.74 mana: 0.65 activations of an
# ability costing 4.
#
# THREE ACTIVATIONS, and the reasoning so it can be disagreed with: one
# activation is a cantrip, two is a good turn, three is where a finite-mana
# board has seen enough library that "assembled" is honest.
#
# Below the dig's effective 14 because Thrasios digs deeper per mana than Kinnan
# does. Below the four that would have been picked before the measurement below,
# because the across-turn ramp is real even though it does not compound within a
# chain.
#
# THE ZERO-PAYBACK RESULT IS STRUCTURAL, NOT EMPIRICAL. The revealed land enters
# TAPPED, so it cannot fund the next activation in the same chain - regardless of
# deck, land count or library state. A board with M mana gets floor(M/4)
# activations and not one more. The measurement (25.6% of the undrawn library is
# land, at 20,000 firings) only confirms a result that holds without it, which is
# why a constant N is the right shape here for a stronger reason than it was for
# the dig.
#
# STATED APPROXIMATION: the scry is not modelled. Scry 1 makes the reveal two
# looks, so a pilot can push the land rate from 26% to about 45% if they want
# ramp or down to about 7% if they want cards - and within a combo turn they want
# cards, because the land is tapped and does nothing. SELECT is in the section
# 4.2 kind set, has two users, and is unimplemented; the decision is also outside
# the scorer's vocabulary, since valuing "a tapped land now versus an unknown
# card" needs a notion of an unknown card that section 6.3 deliberately denies
# it. Modelling neither branch UNDERSTATES Thrasios - the conservative direction,
# and the one place in section 16 where missing machinery does not flatter the
# deck.
[win.requires]
flag            = "WIDE_COLOUR"
in_play         = ["Thrasios, Triton Hero"]
loop_entry_cost = 4
activations     = 3

# ---------------------------------------------------------------------------
# Policy (SIM_PLAN.md section 6.2).
#
# These numbers ARE the model's bias, and the point of authoring them is that
# the bias becomes stateable: "these results assume this piloting" is a claim
# you can read and disagree with. Read a trace before trusting any of it:
#
#     cs data/cards.json --trace 12345
#
# PROVISIONAL until effects are authored (Phase 7). Ranks below cover the
# engine pieces, the outlets and the fast mana; everything else takes
# default_rank. A rank is a relative preference, not a power level.
# ---------------------------------------------------------------------------

[policy]
land_floor   = 3     # below this, a land outranks almost any spell
land_ceiling = 6     # at or above this, lands are near-worthless
default_rank = 10
life_floor   = 10    # below this the deck stops paying life for mana (40 to start)

[policy.rank]
# The engine and its outlets. Kinnan is the deck.
"Kinnan, Bonder Prodigy"  = 100
"Basalt Monolith"         = 90
"Thrasios, Triton Hero"   = 88
"Enduring Vitality"       = 80

# Fast mana: cheap, and every one of them is a turn.
# (No Mana Crypt in this list - the loader caught that when it was ranked here.)
