# Hand-authored card effects (SIM_PLAN.md sections 4.2, 4.7).
#
# A property of the CARD, not the deck, so ablated variants share one copy and
# cannot drift. Authored in DEPENDENCY ORDER: MANA_SOURCE and
# STATIC_MANA_MODIFIER first, because Kinnan's multiplier is the piece every
# other effect is measured through and it has to be right before anything is
# authored against it.
#
# `authored_from` pins the rules text the author actually read. The exporter
# rehashes it and warns on drift, because the nightly ingest moves card text and
# an effect authored against text that has since changed is where this layer
# rots silently.
#
# KNOWN SIMPLIFICATION, stated with its direction: LIFE IS NOT TRACKED. Ancient
# Tomb, City of Brass, Mana Confluence, Tarnished Citadel, Yavimaya Coast,
# Waterlogged Grove and Talisman of Curiosity all cost life to use, and Breeding
# Pool and Soporific Springs cost life to enter untapped. All are treated as
# free, which OVERSTATES the deck. `life_cost` is recorded but unused, so the
# day life is tracked the data is already here.

# ===========================================================================
# STATIC_MANA_MODIFIER - authored first; everything else is measured through it
# ===========================================================================

[cards."Kinnan, Bonder Prodigy"]
status = "modeled"
authored_from = "e5200fde30b8b8ca9b11a65c8865acb68e413e913714acde53623d8467d10589"
# "Whenever you tap a nonland permanent for mana, add one mana of any type that
# permanent produced." ADDITIVE +1 of an already-produced type, not a doubler:
# Basalt taps for {C}{C}{C} and becomes 4, not 6. And the bonus matches the type
# produced, so a Birds under Kinnan makes TWO OF ONE COLOUR - not one of each.
# The {5}{G}{U} dig ability is a TUTOR and is not authored yet.
effects = [ { kind = "STATIC_MANA_MODIFIER", mode = "multiply", bonus = 1, nonland_only = true } ]

[cards."Enduring Vitality"]
status = "modeled"
authored_from = "c5318d2091951d0c8ab73641e34301abc30f9e80461dde4f8744d7dc348dd4ac"
# "Creatures you control have '{T}: Add one mana of any color.'" Turns every
# creature into a source, which Kinnan then doubles.
effects = [ { kind = "STATIC_MANA_MODIFIER", mode = "grant_creature_mana", colors = ["W","U","B","R","G"], amount = 1 } ]

