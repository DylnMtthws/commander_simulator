convoke = true
# {X}{G}{G}{G}, and the ninth tutor. The search half is Finale of Devastation's
# exactly - a creature with mana value X or less, onto the battlefield.
#
# CONVOKE is the whole reason this was left until last, and the modelling
# decision is worth stating because it is EXACT rather than an approximation.
# Convoke lets each creature tapped pay {1} or one mana of its colour. So a
# creature is offered to convoke only if it has no mana ability of its own:
#
#   * A mana dork under Kinnan taps for TWO mana. Convoking it pays one. Tapping
#     it for mana therefore weakly dominates convoking it on every board this
#     deck can reach, and without Kinnan the two are equal - so never offering a
#     mana creature to convoke loses nothing.
#   * Everything else on the battlefield with the Creature type - Thrasios,
#     Trophy Mage, Valley Floodcaller, a clone of one of them - has no mana
#     ability, and convoke is the only way it ever pays for anything.
#
# Convoke mana is NOT multiplied by Kinnan. "Whenever you tap a nonland
# permanent FOR MANA" - convoke taps no mana ability, it pays a cost. Getting
# that wrong would have made this the best card in the deck.
effects = [ { kind = "TUTOR", filter = "creature", destination = "battlefield", max_from_x = true } ]

