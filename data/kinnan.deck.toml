# The Kinnan deck.
#
# Phase 1 needs only the card list and the declared assumptions. Authored
# ranks, win patterns, engines and scorer weights arrive in Phases 4-5
# (SIM_PLAN.md sections 5 and 6); this file grows rather than being replaced.

[deck]
name      = "Kinnan cEDH"
commander = "Kinnan, Bonder Prodigy"

# Versioned strategy boundary. This is the first and currently only supported
# pack; a candidate naming any other pack or commander is rejected rather than
# being run through Kinnan's policy by accident.
[strategy_pack]
id      = "kinnan-midrange-goldfish"
version = "1.0.0"
supported_commander_oracle_ids = ["8d11aa49-d4cd-48b1-aa0f-8548fa733416"]
supported_effect_definitions = [
  "MANA_SOURCE", "DYNAMIC_MANA_SOURCE", "RITUAL", "MASS_UNTAP",
  "DRAW", "SELECT", "TUTOR", "FETCH", "CLONE", "STATIC_MANA_MODIFIER",
  "CARD_COST", "EXILE_LIBRARY", "MILL", "ESCAPE", "UNTAP_TARGET",
]
assembly_objectives = [
  "infinite_C_into_thrasios",
  "infinite_C_outlet_in_hand",
  "wide_colour_into_thrasios",
]
play_policy_implementation = "authored-kinnan-policy.v1"
declared_table_assumptions = [
  "goldfish with no simulated opponents",
  "three-opponent card-text context",
  "opponents collectively expose WUBRG for conditional mana sources",
  "on the play",
]
known_blind_spots = [
  "no stack or live interaction",
  "no combat or opponent-facing terminal kill",
  "summoning sickness is not modeled",
  "legend rule is not modeled",
  "Hullbreaker Horror is knowingly misclassified inert",
  "Sylvan Library, The One Ring, Thrasios activation, and Valley Floodcaller are unauthored",
]

# PROVENANCE. A DECK FILE WITHOUT A DATE IS A CLAIM ABOUT A LIST THAT MAY NOT
# EXIST ANYMORE.
#
# This is `authored_from` applied one level up. effects.toml pins the ORACLE
# TEXT an author read, because the nightly ingest moves card text and an effect
# authored against text that has since changed rots silently. The same is true
# of the decklist: this is a snapshot of a living Moxfield list, the list has
# since changed, and without a stamp nothing distinguishes "the deck" from "the
# deck as it was on some unrecorded day".
#
# THREE VERSIONS ARE KNOWN TO EXIST and the distinction matters when reading
# anything written about this deck:
#
#   A  this file. What the model authors and measures.
#   B  the list as exported 2026-09-02. 29 cards differ from A (SIM_PLAN 17).
#   C  the version the published primer was written against, OLDER THAN BOTH.
#      Its sample hands use Mana Crypt and Gemstone Caverns; Mana Crypt is in
#      the maybeboard of both A and B. Its "noteworthy exclusions" list
#      Delighted Halfling and Faerie Mastermind, and B plays both.
#
# `source_url` IS DEFERRED, NOT OMITTED. The URL was not recorded when this
# snapshot was taken and is not something to reconstruct from a guess - a wrong
# URL is worse than a missing one, because it resolves. The run report prints
# the gap on every run rather than letting an absent field be invisible.
[provenance]
source          = "Moxfield"
source_url      = ""                    # UNRECORDED - see above
snapshot_date   = "2026-09-01"          # first commit of this file
snapshot_note   = "Grind Them Into Dust - Kinnan Midrange Control, WoundedSatellite"
# sha256 of the 99 mainboard names, sorted, newline-joined. Two runs agreeing
# here used the same list; a changed list changes this before it changes any
# number downstream.
cards_sha256    = "f3919eaf185bfb73305eb1d58ea652f083aec789ffc0844487fbf2b68b24114c"

# Every field below is REQUIRED and none has a default. An unstated assumption
# is the failure SIM_PLAN.md sections 2.8 and 9.4 exist to prevent, so omitting
# one fails the build rather than silently picking a value.

[table]
# What the model assumes about the rest of the table. NOT an opponent model -
# only cards whose text tests these values read them (section 2.8).
opponents       = 3                          # a four-player pod
opponent_colors = ["W", "U", "B", "R", "G"]  # Exotic Orchard / Fellwar Stone
on_the_play     = true                       # biases Gemstone Caverns; see 2.8

[ablation]
# The baseline every leave-one-out result is measured against (section 9.4).
# A finding that survives a change of baseline is about the card; one that does
# not was about the baseline.
replacement = "Forest"

[cards]
# The 99, as front-face names printed on a decklist. The exporter resolves
# "Sink into Stupor" to "Sink into Stupor // Soporific Springs" (section 2.3).
#
# A TOML note worth knowing: this array lives under its own [cards] header
# because a bare key written after [ablation] would silently become part of
