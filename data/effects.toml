# ===========================================================================
# TUTOR - nine of them, and the deck's real card selection.
#
# DESTINATION MATTERS AND IS NOT AN AFTERTHOUGHT. A tutor to the battlefield
# puts a permanent into play now; a tutor to hand puts a card you must still
# cast, next turn, for its mana cost. The scorer builds its hypothetical in the
# right zone, so a to-hand target can only complete a pattern with an `in_hand`
# term - and the turn of delay is simply not credited, an approximation in the
# CONSERVATIVE direction.
#
# NOTE ON WHAT IS ABSENT: no Vampiric Tutor, no Imperial Seal, no Mystical or
# Worldly Tutor - all black or white, and this deck is Simic. Nothing here puts
# a card on TOP of the library, so the "value depends on next turn" problem that
# would defeat a lookahead-free scorer does not arise in this deck at all. It
# would in a deck that ran them.
#
# Chord of Calling is authored LAST and separately: convoke pays part of its
# cost by tapping creatures, which reads the battlefield and interacts with
# Kinnan, and it is the most complex cost in the deck.
# ===========================================================================

[cards."Finale of Devastation"]
