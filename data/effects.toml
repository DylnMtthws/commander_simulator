# ===========================================================================
# CLONE - eight cards, the second-largest kind, and the one the first draft of
# the taxonomy missed entirely (section 4.2). In a Kinnan shell a clone's usual
# job is copying a mana source, and the copy is a separate permanent that Kinnan
# multiplies independently.
#
# A clone with nothing legal to copy is DEAD, not mediocre, and the scorer marks
# it uncastable rather than zero - otherwise an empty board leaves it mid-table
# and the policy casts it for nothing.
# ===========================================================================

