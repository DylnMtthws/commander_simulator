# ---------------------------------------------------------------------------
# LANDS, ranked deliberately.
#
# Ranks live here rather than in effects.toml because a rank is a per-DECK
# preference, not a property of the card - the same land ranks differently in a
# deck with different colour requirements.
#
# Why this matters more than it looks: land rank is the tiebreak for BOTH the
# land drop and the fetch target. Every land previously shared default_rank, so
# fetch targets tied at 10000 and resolved by export_index - which is
# alphabetical by card name. The fetch decision was being made by the alphabet.
#
# THE ORDERING, so it can be disagreed with rather than reverse-engineered:
#
#   1. Untapped duals with no cost      Tropical Island, Command Tower
#   2. Untapped duals in THIS context   Rejuvenating Springs (opponents = 3),
#                                       Exotic Orchard (opponent_colors)
#   3. Fetches, by what they reach      Misty Rainforest reaches all four
#   4. Conditional-untapped duals       Breeding Pool (life), Botanical Sanctum (early)
#   5. Duals with a recurring cost      Yavimaya Coast, Waterlogged Grove
#   6. Any-colour with a cost           City of Brass, Mana Confluence, Tarnished Citadel
#   7. Colourless                       Ancient Tomb (fast but Kinnan cannot use it)
#   8. Basics                           Forest, Island
#   9. Single-colour utility            Otawara, Boseiju, Sink into Stupor
#  10. Near-dead                        Gemstone Caverns (free play never applies)
#
# Two orderings worth arguing about. Ancient Tomb is the fastest land in the
# deck and ranks 8th, because it makes COLOURLESS and every spell here has
# coloured pips. And Exotic Orchard ranks 2nd only because [table] says
# opponent_colors is WUBRG - set that to [] and it produces nothing at all.
# ---------------------------------------------------------------------------

