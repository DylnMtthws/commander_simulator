# ===========================================================================
# DRAW - put N cards from the library into hand.
#
# ONE user in this deck, and it is here because of HOW it was found rather than
# because the kind was planned for. See the entry.
# ===========================================================================

[cards."Borne Upon a Wind"]
status = "modeled"
authored_from = "7e4f470294e075e97c76ccf15c1a415a17a3bff1994a8c1697c641b5ae0863c0"
# "You may cast spells this turn as though they had flash. / Draw a card."
#
# THE NEAR-MISS THE INERT TABLE EXISTS TO CATCH, and it is worth its own line
# because it is the failure DIRECTION that has no symptom. Reading the first
# line and stopping gives `timing_only` - the identical, and correct, reading
# that put High Fae Trickster in the inert table: there is no stack and no
# priority here, so granting flash does nothing. The second line is a cantrip.
#
# Stated precisely, because the count did not move: this card was never filed as
# inert, it was UNAUTHORED. What it establishes is that the obvious reading
# would have filed it, next to a card already in the table for that same reading.
#
# An inert card that turns out to do something is the expensive error, because
# nothing downstream ever contradicts it: an unmodelled effect makes the deck
# look slower, the number stays plausible, and the card sits in a table headed
# "what the model cannot see" where its being there is the whole point. The
# category would not have been wrong about the clause it described. It would
# have been wrong about that being the only clause.
#
# So the 31 deserve a re-read rather than a re-count, and `timing_only` - one
# card, one line of text - is where a re-read starts.
effects = [ { kind = "DRAW", cards = 1 } ]

