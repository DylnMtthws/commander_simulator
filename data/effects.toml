[cards."Flash Photography"]
status = "modeled"
authored_from = "b8b23c10fee3c37709024f0a6b909cb02be9690a09232769aef1aeb8d3f466ea"
# Creates a TOKEN copy rather than entering as one; identical for this model,
# since nothing here distinguishes a token from a permanent.
#
# NARROWER THAN THE CARD, deliberately: the text is "target permanent", which
# includes LANDS, and no other clone in the deck can copy one. Modelled as
# nonland_permanent because the clone machinery keys off copy_of and a land copy
# would need the land-drop path. UNDERSTATES by whatever copying Gaea's Cradle
# would be worth, which in THIS deck is nothing - there is no such land in it.
effects = [ { kind = "CLONE", filter = "nonland_permanent" } ]

[cards."Mirage Mirror"]
