[project]
name = "mtgsim-service"
version = "0.1.0"
description = "Stateless HTTP wrapper for commander_simulator"
requires-python = ">=3.13"
dependencies = ["mtgsim-export"]

[project.scripts]
mtgsim-serve = "mtgsim_service.server:main"

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgsim_service"]

[tool.uv.sources]
mtgsim-export = { path = "../export" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
